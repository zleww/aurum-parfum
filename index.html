<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurum Parfum | Luxury Scents</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-sand: #d1c1a9;
      --bg-cream: #fbf9f5;
      --card-bg: #f4eee5;
      --gold-accent: #c5a059;
      --gold-dark: #a8843c;
      --gold-light: #e5d7ba;
      --brown-dark: #3e3229;
      --text-dark: #1f1d1a;
      --text-muted: #736b63;
      --white: #ffffff;
      --danger: #b23b3b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
    }

    h1, h2, h3, .logo {
      font-family: 'Cormorant Garamond', serif;
      letter-spacing: 1px;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 4rem;
      background-color: rgba(251, 249, 245, 0.96);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(197, 160, 89, 0.25);
    }

    .logo {
      font-size: 1.7rem;
      font-weight: 600;
      color: var(--text-dark);
      letter-spacing: 2px;
    }

    .nav-links {
      display: flex;
      gap: 1.2rem;
    }

    .nav-btn {
      background: none;
      border: none;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      color: var(--brown-dark);
      padding: 4px 6px;
      transition: all 0.2s;
    }

    .nav-btn.active, .nav-btn:hover {
      color: var(--gold-dark);
      border-bottom: 1.5px solid var(--gold-dark);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .search-box input {
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid #dcd5cb;
      background: #fff;
      font-size: 0.85rem;
      width: 190px;
      font-family: inherit;
    }

    .cart-btn {
      background: var(--text-dark);
      color: #fff;
      border: none;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .admin-link {
      font-size: 0.78rem;
      color: var(--gold-dark);
      text-decoration: none;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Hero */
    .hero-section {
      background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.4)), 
                  url('images/hero.jpg') center/cover no-repeat;
      min-height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      padding: 2rem;
    }

    .hero-content h1 {
      font-size: 3.4rem;
      font-weight: 400;
      margin-bottom: 0.8rem;
    }

    .hero-content p {
      font-size: 1.05rem;
      margin-bottom: 1.8rem;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    .btn-hero {
      display: inline-block;
      padding: 10px 28px;
      background: transparent;
      color: #fff;
      border: 1px solid #fff;
      border-radius: 25px;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s;
    }

    .btn-hero:hover {
      background: #fff;
      color: var(--text-dark);
    }

    /* Scent Family Filters */
    .scent-families {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2.2rem 1rem 1rem;
    }

    .family-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .family-pills {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .pill {
      border: 1px solid #d9d0c5;
      background: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: inherit;
      transition: 0.2s;
    }

    .pill.active, .pill:hover {
      background: var(--gold-dark);
      color: #fff;
      border-color: var(--gold-dark);
    }

    /* Catalog Grid */
    .catalog-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .section-title {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .section-title h2 {
      font-size: 2.2rem;
      font-weight: 400;
    }

    .section-title p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      transition: transform 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(0,0,0,0.04);
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card-img-wrapper {
      background: var(--card-bg);
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .card-img-wrapper img {
      max-height: 80%;
      max-width: 80%;
      object-fit: contain;
    }

    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 0.65rem;
      padding: 3px 8px;
      background: var(--gold-dark);
      color: #fff;
      border-radius: 10px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .out-stock-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 0.65rem;
      padding: 3px 8px;
      background: var(--danger);
      color: #fff;
      border-radius: 10px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card-info {
      padding: 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-tag {
      font-size: 0.7rem;
      color: var(--gold-dark);
      text-transform: uppercase;
      font-weight: 600;
    }

    .card-name {
      font-size: 1.2rem;
      margin: 4px 0;
    }

    .card-price {
      font-size: 1rem;
      font-weight: 600;
      margin-top: auto;
      padding-top: 8px;
    }

    /* Product Checkout Modal (Tom Ford Layout) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #fff;
      width: 850px;
      max-width: 100%;
      border-radius: 8px;
      padding: 2.5rem;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.8rem;
      background: none;
      border: none;
      cursor: pointer;
    }

    .modal-body {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 2.5rem;
    }

    .modal-img-col {
      background: var(--card-bg);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .modal-img-col img {
      max-width: 100%;
      max-height: 320px;
      object-fit: contain;
    }

    .modal-detail-col h2 {
      font-size: 1.8rem;
      margin-bottom: 0.8rem;
    }

    .detail-row {
      font-size: 0.85rem;
      margin-bottom: 0.6rem;
      color: var(--brown-dark);
    }

    .detail-row strong {
      color: var(--text-dark);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }

    .modal-price {
      font-size: 1.6rem;
      font-weight: 600;
      margin: 1.2rem 0;
      color: var(--gold-dark);
    }

    .qty-selector {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 1.2rem 0;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      border: 1px solid #d9d0c5;
      border-radius: 4px;
      overflow: hidden;
    }

    .btn-qty {
      background: #fff;
      border: none;
      padding: 6px 14px;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-qty:hover { background: #f0ebe1; }

    .qty-display {
      padding: 6px 16px;
      font-weight: 600;
      font-size: 0.9rem;
      background: #fbf9f5;
      border-left: 1px solid #d9d0c5;
      border-right: 1px solid #d9d0c5;
    }

    .btn-add-cart {
      background: var(--text-dark);
      color: #fff;
      border: none;
      width: 100%;
      padding: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    .btn-add-cart:hover { background: var(--gold-dark); }

    /* Cart Drawer */
    .cart-drawer {
      position: fixed;
      right: -380px;
      top: 0;
      width: 350px;
      height: 100vh;
      background: #fff;
      box-shadow: -4px 0 20px rgba(0,0,0,0.1);
      transition: right 0.3s ease;
      z-index: 300;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
    }

    .cart-drawer.active {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 1rem;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      margin: 1rem 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      border-bottom: 1px solid #f9f9f9;
      padding-bottom: 0.8rem;
    }

    .btn-cart-qty {
      background: #eee;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
    }

    .cart-footer {
      border-top: 1px solid #eee;
      padding-top: 1rem;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .btn-checkout {
      width: 100%;
      background: var(--gold-dark);
      color: #fff;
      border: none;
      padding: 12px;
      text-transform: uppercase;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    @media (max-width: 768px) {
      .navbar { flex-direction: column; gap: 1rem; padding: 1rem; }
      .modal-body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Navigation Header -->
  <header class="navbar">
    <div class="nav-links">
      <button class="nav-btn active" data-filter="tag" data-val="all">All Scents</button>
      <button class="nav-btn" data-filter="gender" data-val="Women">Women</button>
      <button class="nav-btn" data-filter="gender" data-val="Men">Men</button>
      <button class="nav-btn" data-filter="gender" data-val="Unisex">Unisex</button>
      <button class="nav-btn" data-filter="tag" data-val="New Arrivals">New Arrivals</button>
      <button class="nav-btn" data-filter="tag" data-val="Best Seller">Best Sellers</button>
      <button class="nav-btn" data-filter="tag" data-val="Sale">Sale</button>
    </div>
    <div class="logo">AURUM PARFUM</div>
    <div class="nav-actions">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search perfume or note...">
      </div>
      <button class="cart-btn" onclick="openCart()">Bag (<span id="cartCount">0</span>)</button>
      <a href="admin.html" class="admin-link">Owner Portal</a>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="hero-section">
    <div class="hero-content">
      <h1>Where Scent Becomes Emotion</h1>
      <p>Discover hand-crafted inspired fragrances made to capture your true individuality.</p>
      <a href="#catalog" class="btn-hero">Explore Fragrances</a>
    </div>
  </section>

  <!-- Scent Note Pills -->
  <section class="scent-families">
    <span class="family-label">Explore Scent Notes:</span>
    <div class="family-pills">
      <button class="pill active" data-filter="scent_family" data-val="all">All Notes</button>
      <button class="pill" data-filter="scent_family" data-val="Fresh">Fresh</button>
      <button class="pill" data-filter="scent_family" data-val="Floral">Floral</button>
      <button class="pill" data-filter="scent_family" data-val="Woody">Woody</button>
      <button class="pill" data-filter="scent_family" data-val="Sweet">Sweet</button>
      <button class="pill" data-filter="scent_family" data-val="Fruity">Fruity</button>
    </div>
  </section>

  <!-- Product Catalog -->
  <main class="catalog-container" id="catalog">
    <div class="section-title">
      <h2 id="currentHeading">Best Sellers & Signatures</h2>
      <p id="matchCount">Showing all fragrances</p>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </main>

  <!-- Product Checkout Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Cart Drawer -->
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Your Bag</h3>
      <button class="close-btn" onclick="closeCart()">&times;</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cartTotal">₱0.00</span>
      </div>
      <button class="btn-checkout" onclick="checkout()">Proceed to Checkout</button>
    </div>
  </div>

  <!-- Inlined Store Logic -->
  <script>
    const CORE_INITIAL_CATALOG = [
      { id: 1, name: "Dior Sauvage", gender: "Men", scent_family: "Fresh", tag: "Best Seller", notes: "Calabrian Bergamot, Sichuan Pepper, Ambroxan", best_time: "Night Out / Versatile Daily", description: "Radically fresh, raw, and magnetic with crisp citrus and intense ambery woods.", price: 250, stock: 30, image: "images/dior-sauvage.png" },
      { id: 2, name: "Versace Eros", gender: "Men", scent_family: "Sweet", tag: "Best Seller", notes: "Mint Leaves, Green Apple, Tonka Bean, Vanilla", best_time: "Party / Evening / Fall", description: "A luminous aura with an intense, vibrant, and glowing combination of fresh mint and sweet vanilla.", price: 250, stock: 25, image: "images/versace-eros.png" },
      { id: 3, name: "Lacoste Black", gender: "Men", scent_family: "Woody", tag: "New Arrivals", notes: "Watermelon, Basil, Lavender, Dark Chocolate", best_time: "Casual Days / Warm Evenings", description: "An intense, refreshing contrast that blends aqueous watermelon with an unexpected dark chocolate finish.", price: 250, stock: 20, image: "images/lacoste-black.png" },
      { id: 4, name: "Bvlgari Extreme", gender: "Men", scent_family: "Fresh", tag: "Sale", notes: "Darjeeling Tea, Bergamot, Cardamom, Guaiac Wood", best_time: "Office / Formal / Summer", description: "Understated refinement expressing classic masculine elegance with woody tea nuances.", price: 250, stock: 15, image: "images/bvlgari-extreme.png" },
      { id: 5, name: "CK One", gender: "Unisex", scent_family: "Fresh", tag: "Best Seller", notes: "Green Tea, Papaya, Bergamot, Jasmine, Musk", best_time: "Everyday Casual / Morning", description: "The universally clean, iconic citrus harmony designed for effortless daily wear.", price: 250, stock: 40, image: "images/ck-one.png" },
      { id: 6, name: "Valaya", gender: "Unisex", scent_family: "Floral", tag: "New Arrivals", notes: "White Peach, Aldehydes, Orange Blossom, Ambroxan", best_time: "Signature Daily / Spring", description: "An ethereal sensation of soft white cotton, radiant clean florals, and subtle musks.", price: 250, stock: 18, image: "images/valaya.png" },
      { id: 7, name: "Ariana Grande Cloud", gender: "Women", scent_family: "Sweet", tag: "Best Seller", notes: "Lavender Blossom, Coconut Cream, Praline, Vanilla", best_time: "Cool Weather / Date Night", description: "An uplifting, dreamy scent imbued with decadent praline and airy whipped cream.", price: 250, stock: 35, image: "images/cloud.png" },
      { id: 8, name: "Chanel Chance", gender: "Women", scent_family: "Floral", tag: "Best Seller", notes: "Pink Pepper, Jasmine, Patchouli, Amber Musk", best_time: "Daytime Professional / High Tea", description: "An unpredictable, sparkling floral constellation wrapped in soft spiced elegance.", price: 250, stock: 22, image: "images/chanel-chance.png" },
      { id: 9, name: "Incanto Shine", gender: "Women", scent_family: "Fruity", tag: "Sale", notes: "Pineapple, Passionfruit, Freesia, White Cedar", best_time: "Summer / Outings / Casual", description: "A dazzling tropical fantasy rich with ripe passionfruit and cheerful sunny blooms.", price: 250, stock: 12, image: "images/incanto-shine.png" },
      { id: 10, name: "Bombshell", gender: "Women", scent_family: "Fruity", tag: "New Arrivals", notes: "Purple Passion Fruit, Shangri-la Peony, Vanilla Orchid", best_time: "Afternoon / Casual Glam", description: "A vibrant blend of fresh-cut peonies and exotic sun-drenched fruits.", price: 250, stock: 28, image: "images/bombshell.png" }
    ];

    let perfumes = [];
    let cart = [];
    let activeFilters = { gender: 'all', tag: 'all', scent_family: 'all', search: '' };
    let selectedQty = 1;

    function getSharedCatalog() {
      const stored = localStorage.getItem('aurum_master_catalog');
      if (stored) return JSON.parse(stored);
      localStorage.setItem('aurum_master_catalog', JSON.stringify(CORE_INITIAL_CATALOG));
      return CORE_INITIAL_CATALOG;
    }

    function saveSharedCatalog(catalog) {
      localStorage.setItem('aurum_master_catalog', JSON.stringify(catalog));
    }

    function syncStore() {
      perfumes = getSharedCatalog();
      renderCatalog();
    }

    function renderCatalog() {
      const grid = document.getElementById('productGrid');
      if (!grid) return;
      grid.innerHTML = '';

      const filtered = perfumes.filter(p => {
        const matchGender = activeFilters.gender === 'all' || p.gender.toLowerCase() === activeFilters.gender.toLowerCase();
        const matchTag = activeFilters.tag === 'all' || p.tag.toLowerCase() === activeFilters.tag.toLowerCase();
        const matchFamily = activeFilters.scent_family === 'all' || p.scent_family.toLowerCase() === activeFilters.scent_family.toLowerCase();
        const query = activeFilters.search.toLowerCase();
        const matchSearch = !query || 
          p.name.toLowerCase().includes(query) || 
          p.notes.toLowerCase().includes(query) ||
          p.scent_family.toLowerCase().includes(query);

        return matchGender && matchTag && matchFamily && matchSearch;
      });

      const matchCount = document.getElementById('matchCount');
      if (matchCount) matchCount.innerText = `Showing ${filtered.length} fragrances`;

      filtered.forEach(p => {
        const isOutOfStock = (p.stock || 0) <= 0;
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openProductModal(p.id);
        card.innerHTML = `
          <div class="card-img-wrapper">
            <span class="badge">${p.gender}</span>
            ${isOutOfStock ? '<span class="out-stock-badge">Sold Out</span>' : ''}
            <img src="${p.image}" alt="${p.name}" onerror="this.src='images/dior-sauvage.png'">
          </div>
          <div class="card-info">
            <span class="card-tag">${p.scent_family} • ${p.tag}</span>
            <h3 class="card-name">${p.name}</h3>
            <p style="font-size:0.75rem; color:#888;">${isOutOfStock ? 'Out of Stock' : `${p.stock} bottles left`}</p>
            <p class="card-price">₱${p.price.toFixed(2)}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openProductModal(id) {
      const item = perfumes.find(p => p.id === id);
      if (!item) return;

      selectedQty = 1;
      const isOutOfStock = (item.stock || 0) <= 0;

      const modalBody = document.getElementById('modalBody');
      modalBody.innerHTML = `
        <div class="modal-img-col">
          <img src="${item.image}" alt="${item.name}" onerror="this.src='images/dior-sauvage.png'">
        </div>
        <div class="modal-detail-col">
          <h2>${item.name}</h2>
          <div class="detail-row"><strong>Category:</strong> ${item.gender} Eau De Parfum</div>
          <div class="detail-row"><strong>Scent Family:</strong> ${item.scent_family}</div>
          <div class="detail-row"><strong>Key Notes:</strong> ${item.notes}</div>
          <div class="detail-row"><strong>Best Time to Wear:</strong> ${item.best_time}</div>
          <div class="detail-row"><strong>Availability:</strong> ${isOutOfStock ? '<span style="color:red;font-weight:600;">Out of Stock</span>' : `<span style="color:green;font-weight:600;">${item.stock} in stock</span>`}</div>
          <p style="margin: 1rem 0; font-size: 0.85rem; color: #555;">${item.description}</p>
          <div class="modal-price">₱${item.price.toFixed(2)}</div>
          
          ${!isOutOfStock ? `
            <div class="qty-selector">
              <span style="font-size:0.8rem; text-transform:uppercase; font-weight:600;">Quantity:</span>
              <div class="qty-controls">
                <button type="button" class="btn-qty" onclick="changeModalQty(-1, ${item.stock})">-</button>
                <span id="modalQtyDisplay" class="qty-display">1</span>
                <button type="button" class="btn-qty" onclick="changeModalQty(1, ${item.stock})">+</button>
              </div>
            </div>
            <button class="btn-add-cart" onclick="addToCart(${item.id})">Add to Bag</button>
          ` : `
            <button class="btn-add-cart" style="background:#999; cursor:not-allowed;" disabled>Currently Sold Out</button>
          `}
        </div>
      `;
      document.getElementById('productModal').classList.add('active');
    }

    function changeModalQty(delta, maxStock) {
      selectedQty += delta;
      if (selectedQty < 1) selectedQty = 1;
      if (selectedQty > maxStock) selectedQty = maxStock;
      document.getElementById('modalQtyDisplay').innerText = selectedQty;
    }

    function closeModal() {
      document.getElementById('productModal').classList.remove('active');
    }

    function addToCart(id) {
      const item = perfumes.find(p => p.id === id);
      if (!item) return;

      const existing = cart.find(c => c.id === id);
      const currentInCart = existing ? existing.quantity : 0;

      if (currentInCart + selectedQty > item.stock) {
        return alert(`Sorry, we only have ${item.stock} units available.`);
      }

      if (existing) {
        existing.quantity += selectedQty;
      } else {
        cart.push({ ...item, quantity: selectedQty });
      }

      updateCartUI();
      closeModal();
      openCart();
    }

    function updateCartUI() {
      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cartCount').innerText = totalCount;
      
      const list = document.getElementById('cartItems');
      list.innerHTML = '';
      
      let sum = 0;
      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        sum += itemTotal;
        const el = document.createElement('div');
        el.className = 'cart-item';
        el.innerHTML = `
          <div style="flex:1;">
            <strong>${item.name}</strong><br>
            <small>₱${item.price.toFixed(2)} × ${item.quantity} = ₱${itemTotal.toFixed(2)}</small>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button onclick="modifyCartQty(${index}, -1)" class="btn-cart-qty">-</button>
            <span style="font-size:0.85rem; font-weight:600;">${item.quantity}</span>
            <button onclick="modifyCartQty(${index}, 1)" class="btn-cart-qty">+</button>
            <button onclick="removeCartItem(${index})" style="border:none;background:none;color:red;cursor:pointer;font-size:1.1rem;margin-left:6px;">&times;</button>
          </div>
        `;
        list.appendChild(el);
      });

      document.getElementById('cartTotal').innerText = `₱${sum.toFixed(2)}`;
    }

    function modifyCartQty(index, delta) {
      const item = cart[index];
      const catalogItem = perfumes.find(p => p.id === item.id);
      const maxStock = catalogItem ? catalogItem.stock : 999;

      item.quantity += delta;
      if (item.quantity > maxStock) item.quantity = maxStock;
      if (item.quantity <= 0) cart.splice(index, 1);
      updateCartUI();
    }

    function removeCartItem(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function openCart() { document.getElementById('cartDrawer').classList.add('active'); }
    function closeCart() { document.getElementById('cartDrawer').classList.remove('active'); }

    async function checkout() {
      if (cart.length === 0) return alert('Your bag is currently empty.');
      
      const customerName = prompt('Enter your full name:');
      if (!customerName) return;
      const customerPhone = prompt('Enter contact number:');
      if (!customerPhone) return;
      const address = prompt('Enter delivery address:');
      if (!address) return;

      const totalAmount = cart.reduce((a, c) => a + (c.price * c.quantity), 0);
      const orderPayload = {
        order_id: `AUR-${Date.now().toString().slice(-4)}`,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        status: 'Pending',
        customer_name: customerName,
        customer_phone: customerPhone,
        shipping_address: address,
        items: cart.map(i => ({ id: i.id, name: i.name, price: i.price, quantity: i.quantity })),
        total_amount: totalAmount
      };

      // Deduct inventory stock
      let catalog = getSharedCatalog();
      cart.forEach(cartItem => {
        const found = catalog.find(p => p.id === cartItem.id);
        if (found) {
          found.stock = Math.max(0, (found.stock || 0) - cartItem.quantity);
        }
      });
      saveSharedCatalog(catalog);

      // Store new order
      let orders = JSON.parse(localStorage.getItem('aurum_orders') || '[]');
      orders.unshift(orderPayload);
      localStorage.setItem('aurum_orders', JSON.stringify(orders));

      alert(`Thank you ${customerName}! Your order for ${cart.reduce((s, i) => s + i.quantity, 0)} bottles totaling ₱${totalAmount.toFixed(2)} has been placed.`);
      cart = [];
      updateCartUI();
      closeCart();
      syncStore();
    }

    // Filter Buttons
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        
        const filterType = e.target.getAttribute('data-filter');
        const val = e.target.getAttribute('data-val');
        
        if (filterType === 'gender') {
          activeFilters.gender = val;
          activeFilters.tag = 'all';
        } else {
          activeFilters.tag = val;
          activeFilters.gender = 'all';
        }
        renderCatalog();
      });
    });

    document.querySelectorAll('.pill').forEach(pill => {
      pill.addEventListener('click', (e) => {
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        e.target.classList.add('active');
        activeFilters.scent_family = e.target.getAttribute('data-val');
        renderCatalog();
      });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      activeFilters.search = e.target.value;
      renderCatalog();
    });

    setInterval(syncStore, 2000);
    window.addEventListener('DOMContentLoaded', syncStore);
  </script>
</body>
</html>
